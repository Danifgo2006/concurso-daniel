<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quiz DieF</title>
    <link rel="stylesheet" href="css/styles.css">
</head>

<body>

    <div class="tarjeta-inicio">

        <div class="presentacion-inicio">

            <div class="logo-inicio">
                <img src="img/logo-quiz-dief.png" alt="Logo Quiz DieF">
            </div>

            <p>
                Pon a prueba tus conocimientos de fútbol,
                música y cultura pop.
                ¿Serás capaz de superar todas las rondas?
            </p>

        </div>

        <form id="formulario-inicio">

            <label for="nombre">Nombre del jugador</label>

            <input type="text" id="nombre" placeholder="Escribe tu nombre" required>

            <button type="submit">
                Empezar partida
            </button>

        </form>

    </div>

    <script src="js/inicio.js"></script>

</body>

</html>
